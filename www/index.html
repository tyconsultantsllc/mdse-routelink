<!DOCTYPE html>
<!--

  local "webDir" to exist and sync assets from, but capacitor.config.ts
  below sets server.url to the live, deployed app - so on a real device the
  WebView navigates straight to that URL instead of loading this file. This
  only appears for a split second (if ever) before that navigation happens,
  or if the app is ever run with server.url removed.
-->

      html, body {
        margin: 0;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0f172a;
        color: #e2e8f0;
        font-family: -apple-system, system-ui, Roboto, sans-serif;
      }
    </style>
  </head>
  <body>
    <p>Loading MDSE RouteLink&hellip;</p>
  </body>
</html>
